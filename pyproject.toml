[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuts"
version = "0.1.0"
requires-python = ">=3.12"
description = "Semantic indexing and temporal navigation of long-form video"
dependencies = [
    "av",
    "numpy",
    "opencv-python",
    "pillow",
    "torch",
    "torchvision",
    "transformers",
    "rapidocr-onnxruntime",
    "faster-whisper",
    "anthropic",
]

[project.scripts]
cuts = "cuts.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cuts*"]
